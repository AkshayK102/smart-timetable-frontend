<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Smart Timetable Scheduler</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#1B2A4A', 50: '#EEF1F6', 100: '#D7DEEA', 600: '#1B2A4A', 700: '#152038', 900: '#0D1526' },
            accent: { DEFAULT: '#0F6D66', 50: '#E7F4F2', 600: '#0F6D66', 700: '#0B5652' },
            canvas: '#F6F6F4'
          },
          fontFamily: {
            display: ['Sora', 'sans-serif'],
            sans: ['"Public Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/theme.css">

</head>

<body class="min-h-screen bg-canvas text-slate-800">

<!-- Navbar -->
<nav class="bg-primary-900 text-white">

  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

    <a href="index.html" class="text-xl font-display font-bold">
      Smart Timetable Scheduler
    </a>

    <div class="flex items-center gap-7 text-sm">

      <a href="index.html" class="hover:text-accent">
        Home
      </a>

      <a href="about.html" class="hover:text-accent">
        About
      </a>

      <a href="login.html" class="text-accent font-semibold">
        Login
      </a>

      <a href="signup.html" class="hover:text-accent">
        Sign Up
      </a>

    </div>

  </div>

</nav>


<!-- Login Section -->
<main class="min-h-[calc(100vh-72px)] flex items-center justify-center px-6">

  <div class="w-full max-w-md">

    <!-- Heading -->
    <div class="text-center mb-8">

      <h1 class="font-display text-3xl font-bold text-slate-900">
        Welcome Back
      </h1>

      <p class="mt-2 text-slate-600">
        Login to Smart Timetable Scheduler
      </p>

    </div>


    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8">

      <form id="loginForm">

        <!-- Email -->
        <div class="mb-5">

          <label for="email"
                 class="block text-sm font-semibold text-slate-700 mb-2">
            Email
          </label>

          <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  required
                  class="w-full px-4 py-3 border border-slate-300
                   rounded-lg outline-none
                   focus:ring-2 focus:ring-accent
                   focus:border-accent"
          >

        </div>


        <!-- Password -->
        <div class="mb-5">

          <label for="password"
                 class="block text-sm font-semibold text-slate-700 mb-2">
            Password
          </label>

          <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  required
                  class="w-full px-4 py-3 border border-slate-300
                   rounded-lg outline-none
                   focus:ring-2 focus:ring-accent
                   focus:border-accent"
          >

        </div>


        <!-- Forgot Password -->
        <div class="text-right mb-6">

          <a href="forgot-password.html"
             class="text-sm text-accent-600 hover:text-accent-700">

            Forgot Password?

          </a>

        </div>

        <p id="errorMsg" class="hidden mb-4 text-sm text-red-600"></p>
        <!-- Login Button -->
        <button
                type="submit"
                class="w-full bg-primary hover:bg-primary-700
                 text-white font-semibold py-3 rounded-lg
                 transition duration-200">

          Login

        </button>

      </form>


      <!-- Signup Link -->
      <div class="text-center mt-6">

        <p class="text-sm text-slate-600">

          Don't have an account?

          <a href="signup.html"
             class="text-accent-600 hover:text-accent-700 font-semibold">

            Sign Up

          </a>

        </p>

      </div>

    </div>

  </div>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>


</body>
</html>
