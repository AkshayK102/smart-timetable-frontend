<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Smart Timetable Scheduler</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='9' fill='%230F6D66'/%3E%3Crect x='7' y='9' width='20' height='16' rx='3' fill='%23F6F6F4'/%3E%3Crect x='7' y='9' width='20' height='5' rx='2.5' fill='%231B2A4A'/%3E%3Ccircle cx='11.5' cy='7' r='1.6' fill='%231B2A4A'/%3E%3Ccircle cx='22.5' cy='7' r='1.6' fill='%231B2A4A'/%3E%3Crect x='10.5' y='17' width='4' height='4' rx='1' fill='%230F6D66'/%3E%3Crect x='16' y='17' width='4' height='4' rx='1' fill='%23C7CDDB'/%3E%3Crect x='21.5' y='17' width='4' height='4' rx='1' fill='%23C7CDDB'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                primary: { DEFAULT: '#1B2A4A', 50: '#EEF1F6', 100: '#D7DEEA', 600: '#1B2A4A', 700: '#152038', 900: '#0D1526' },
                accent: { DEFAULT: '#0F6D66', 50: '#E7F4F2', 600: '#0F6D66', 700: '#0B5652' },
                canvas: '#F6F6F4'
              },
              fontFamily: {
                display: ['Sora', 'sans-serif'],
                sans: ['"Public Sans"', 'sans-serif']
              }
            }
          }
        }
    </script>
    <link rel="stylesheet" href="css/theme.css">

</head>

<body class="min-h-screen bg-canvas text-slate-800">

<!-- Navbar -->
<nav class="bg-primary-900 text-white">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

        <a href="index.html" class="flex items-center gap-2.5 text-xl font-display font-bold">
            <svg width="28" height="28" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" class="shrink-0">
                <rect width="34" height="34" rx="9" fill="#0F6D66"/>
                <rect x="7" y="9" width="20" height="16" rx="3" fill="#F6F6F4"/>
                <rect x="7" y="9" width="20" height="5" rx="2.5" fill="#1B2A4A"/>
                <circle cx="11.5" cy="7" r="1.6" fill="#1B2A4A"/>
                <circle cx="22.5" cy="7" r="1.6" fill="#1B2A4A"/>
                <rect x="10.5" y="17" width="4" height="4" rx="1" fill="#0F6D66"/>
                <rect x="16" y="17" width="4" height="4" rx="1" fill="#C7CDDB"/>
                <rect x="21.5" y="17" width="4" height="4" rx="1" fill="#C7CDDB"/>
            </svg>
            <span>Smart Timetable Scheduler</span>
        </a>

        <div class="flex items-center gap-7 text-sm">
            <a href="index.html" class="hover:text-accent">Home</a>
            <a href="about.html" class="hover:text-accent">About</a>
            <a href="login.html" class="text-accent font-semibold">Login</a>
            <a href="signup.html" class="hover:text-accent">Sign Up</a>
        </div>

    </div>
</nav>


<!-- Section -->
<main class="min-h-[calc(100vh-72px)] flex items-center justify-center px-6 py-10">

    <div class="w-full max-w-md">

        <!-- Heading -->
        <div class="text-center mb-8">
            <h1 class="font-display text-3xl font-bold text-slate-900">Forgot Password</h1>
            <p id="subtitle" class="mt-2 text-slate-600">Enter your email and we will send you a reset code.</p>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8">

            <!-- Step 1: email -->
            <form id="emailForm" novalidate>

                <div class="mb-6">
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
                    <input type="email"
                           id="email"
                           placeholder="Enter your registered email"
                           class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-accent focus:border-accent">
                </div>

                <button type="submit"
                        id="sendBtn"
                        class="w-full bg-primary hover:bg-primary-700 disabled:opacity-60 text-white font-semibold py-3 rounded-lg transition duration-200">
                    Send Reset Code
                </button>

            </form>


            <!-- Step 2: code + new password -->
            <form id="resetForm" class="hidden" novalidate>

                <p id="sentInfo" class="mb-5 text-sm text-slate-600"></p>

                <div class="mb-5">
                    <label for="code" class="block text-sm font-semibold text-slate-700 mb-2">6-digit code</label>
                    <input type="text"
                           id="code"
                           inputmode="numeric"
                           maxlength="6"
                           autocomplete="one-time-code"
                           placeholder="Enter the code"
                           class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-accent focus:border-accent tracking-widest">
                </div>

                <div class="mb-5">
                    <label for="newPassword" class="block text-sm font-semibold text-slate-700 mb-2">New Password</label>
                    <input type="password"
                           id="newPassword"
                           placeholder="Create a new password"
                           class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-accent focus:border-accent">
                </div>

                <div class="mb-6">
                    <label for="confirmPassword" class="block text-sm font-semibold text-slate-700 mb-2">Confirm New Password</label>
                    <input type="password"
                           id="confirmPassword"
                           placeholder="Confirm your new password"
                           class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-accent focus:border-accent">
                </div>

                <p id="formMsg" class="hidden mb-4 text-sm font-semibold"></p>

                <button type="submit"
                        id="resetBtn"
                        class="w-full bg-primary hover:bg-primary-700 disabled:opacity-60 text-white font-semibold py-3 rounded-lg transition duration-200">
                    Reset Password
                </button>

                <div class="mt-5 flex items-center justify-between text-sm">
                    <button type="button" id="resendBtn" class="text-accent-600 hover:text-accent-700 disabled:text-slate-400">
                        Resend code
                    </button>
                    <button type="button" id="changeEmailBtn" class="text-accent-600 hover:text-accent-700">
                        Use a different email
                    </button>
                </div>

            </form>


            <!-- Success -->
            <div id="successBox" class="hidden text-center">
                <p class="text-lg font-semibold text-green-700">Your password has been reset.</p>
                <p class="mt-2 text-sm text-slate-600">Taking you to the login page...</p>
            </div>


            <!-- Back link -->
            <div class="text-center mt-6">
                <a href="login.html" class="text-sm text-accent-600 hover:text-accent-700 font-semibold">
                    Back to Login
                </a>
            </div>

        </div>

    </div>

</main>

<script src="js/api.js"></script>
<script>
    const EMAIL_REGEX = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/;

    const emailForm = document.getElementById("emailForm");
    const resetForm = document.getElementById("resetForm");
    const successBox = document.getElementById("successBox");
    const subtitle = document.getElementById("subtitle");

    const emailEl = document.getElementById("email");
    const codeEl = document.getElementById("code");
    const passEl = document.getElementById("newPassword");
    const confirmEl = document.getElementById("confirmPassword");

    const sendBtn = document.getElementById("sendBtn");
    const resetBtn = document.getElementById("resetBtn");
    const resendBtn = document.getElementById("resendBtn");
    const formMsg = document.getElementById("formMsg");

    let currentEmail = "";
    let resendTimer = null;

    // ---------- inline messages under a field ----------
    function setFieldError(input, message) {
      let p = input.parentElement.querySelector(".field-error");
      if (!message) {
        if (p) p.remove();
        return;
      }
      if (!p) {
        p = document.createElement("p");
        p.className = "field-error mt-1.5 text-sm text-red-600";
        p.setAttribute("role", "alert");
        input.insertAdjacentElement("afterend", p);
      }
      p.textContent = message;
    }

    function hasFieldError(input) {
      return input.parentElement.querySelector(".field-error") !== null;
    }

    function showFormMsg(text, ok) {
      formMsg.textContent = text;
      formMsg.className = "mb-4 text-sm font-semibold " + (ok ? "text-green-600" : "text-red-600");
    }

    function hideFormMsg() {
      formMsg.className = "hidden mb-4 text-sm font-semibold";
    }

    // ---------- rules (one message at a time) ----------
    function getEmailError(email) {
      if (email === "") return "Email is required.";
      if (!EMAIL_REGEX.test(email)) return "Please enter a valid email address (for example: name@gmail.com).";
      return null;
    }

    function getCodeError(code) {
      if (code === "") return "Please enter the code we sent you.";
      if (!/^[0-9]{6}$/.test(code)) return "The code must be exactly 6 digits.";
      return null;
    }

    function getPasswordError(password) {
      if (password === "") return "Password is required.";
      if (password.length < 8) return "Password must be at least 8 characters long.";
      if (/\s/.test(password)) return "Password must not contain spaces.";
      if (!/[A-Z]/.test(password)) return "Password must include at least one uppercase letter.";
      if (!/[a-z]/.test(password)) return "Password must include at least one lowercase letter.";
      if (!/[0-9]/.test(password)) return "Password must include at least one number.";
      if (!/[^A-Za-z0-9\s]/.test(password)) return "Password must include at least one special character (for example @, #, $, !).";
      return null;
    }

    function getConfirmError(password, confirmPassword) {
      if (confirmPassword === "") return "Please confirm your new password.";
      if (password !== confirmPassword) return "Passwords do not match.";
      return null;
    }

    function checkEmail() {
      const msg = getEmailError(emailEl.value.trim());
      setFieldError(emailEl, msg);
      return msg === null;
    }
    function checkCode() {
      const msg = getCodeError(codeEl.value.trim());
      setFieldError(codeEl, msg);
      return msg === null;
    }
    function checkPassword() {
      const msg = getPasswordError(passEl.value);
      setFieldError(passEl, msg);
      return msg === null;
    }
    function checkConfirm() {
      const msg = getConfirmError(passEl.value, confirmEl.value);
      setFieldError(confirmEl, msg);
      return msg === null;
    }

    const checks = [
      [emailEl, checkEmail],
      [codeEl, checkCode],
      [passEl, checkPassword],
      [confirmEl, checkConfirm]
    ];

    checks.forEach(function (pair) {
      const input = pair[0];
      const check = pair[1];
      input.addEventListener("blur", function () {
        // do not scold the user for a field they have not touched yet
        if (input.value !== "" || hasFieldError(input)) check();
      });
      input.addEventListener("input", function () {
        if (hasFieldError(input)) check();
      });
    });

    passEl.addEventListener("input", function () {
      if (confirmEl.value !== "") checkConfirm();
    });

    // only digits in the code box
    codeEl.addEventListener("input", function () {
      codeEl.value = codeEl.value.replace(/[^0-9]/g, "");
    });

    // ---------- steps ----------
    function showStepTwo() {
      emailForm.classList.add("hidden");
      resetForm.classList.remove("hidden");
      subtitle.textContent = "Enter the code and choose a new password.";
      document.getElementById("sentInfo").textContent =
        "If an account exists for " + currentEmail + ", we have sent a 6-digit code to it. The code is valid for 10 minutes.";
      codeEl.focus();
    }

    function showStepOne() {
      resetForm.classList.add("hidden");
      emailForm.classList.remove("hidden");
      subtitle.textContent = "Enter your email and we will send you a reset code.";
      [codeEl, passEl, confirmEl].forEach(function (el) {
        el.value = "";
        setFieldError(el, null);
      });
      hideFormMsg();
      emailEl.focus();
    }

    function startResendCooldown() {
      let seconds = 30;
      resendBtn.disabled = true;
      resendBtn.textContent = "Resend code (" + seconds + "s)";
      clearInterval(resendTimer);
      resendTimer = setInterval(function () {
        seconds--;
        if (seconds <= 0) {
          clearInterval(resendTimer);
          resendBtn.disabled = false;
          resendBtn.textContent = "Resend code";
        } else {
          resendBtn.textContent = "Resend code (" + seconds + "s)";
        }
      }, 1000);
    }

    // ---------- step 1: send the code ----------
    emailForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!checkEmail()) {
        emailEl.focus();
        return;
      }

      sendBtn.disabled = true;
      try {
        currentEmail = emailEl.value.trim();
        await apiRequest("/auth/forgot-password", "POST", { email: currentEmail });
        showStepTwo();
        startResendCooldown();
      } catch (err) {
        setFieldError(emailEl, err.message);
      } finally {
        sendBtn.disabled = false;
      }
    });

    resendBtn.addEventListener("click", async function () {
      hideFormMsg();
      resendBtn.disabled = true;
      try {
        await apiRequest("/auth/forgot-password", "POST", { email: currentEmail });
        showFormMsg("A new code has been sent.", true);
        startResendCooldown();
      } catch (err) {
        showFormMsg(err.message, false);
        resendBtn.disabled = false;
      }
    });

    document.getElementById("changeEmailBtn").addEventListener("click", showStepOne);

    // ---------- step 2: reset the password ----------
    resetForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      hideFormMsg();

      let firstInvalid = null;
      checks.slice(1).forEach(function (pair) {
        const ok = pair[1]();
        if (!ok && firstInvalid === null) firstInvalid = pair[0];
      });
      if (firstInvalid !== null) {
        firstInvalid.focus();
        return;
      }

      resetBtn.disabled = true;
      try {
        await apiRequest("/auth/reset-password", "POST", {
          email: currentEmail,
          code: codeEl.value.trim(),
          newPassword: passEl.value
        });

        resetForm.classList.add("hidden");
        successBox.classList.remove("hidden");
        subtitle.textContent = "All done.";
        setTimeout(function () {
          window.location.href = "login.html";
        }, 2500);
      } catch (err) {
        const lower = err.message.toLowerCase();
        if (lower.includes("password")) {
          setFieldError(passEl, err.message);
        } else if (lower.includes("code")) {
          setFieldError(codeEl, err.message);
        } else {
          showFormMsg(err.message, false);
        }
      } finally {
        resetBtn.disabled = false;
      }
    });
</script>

</body>
</html>
