<!-- Signup Section -->
<main class="min-h-[calc(100vh-72px)] flex items-center justify-center px-6 py-10">

  <div class="w-full max-w-md">

    <!-- Heading -->
    <div class="text-center mb-8">

      <h1 class="font-display text-3xl font-bold text-slate-900">
        Create Your Account
      </h1>

      <p class="mt-2 text-slate-600">
        Sign up to use Smart Timetable Scheduler
      </p>

    </div>


    <!-- Signup Card -->
    <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8">

      <form id="signupForm" novalidate>

        <!-- Full Name -->
        <div class="mb-5">

          <label for="fullName"
                 class="block text-sm font-semibold text-slate-700 mb-2">
            Full Name
          </label>

          <input
                  type="text"
                  id="fullName"
                  name="fullName"
                  placeholder="Enter your full name"
                  required
                  class="w-full px-4 py-3 border border-slate-300 rounded-lg
                               outline-none focus:ring-2 focus:ring-accent
                               focus:border-accent"
          >

        </div>


        <!-- Email -->
        <div class="mb-5">

          <label for="email"
                 class="block text-sm font-semibold text-slate-700 mb-2">
            Email
          </label>

          <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  required
                  class="w-full px-4 py-3 border border-slate-300 rounded-lg
                               outline-none focus:ring-2 focus:ring-accent
                               focus:border-accent"
          >

        </div>


        <!-- Password -->
        <div class="mb-5">

          <label for="password"
                 class="block text-sm font-semibold text-slate-700 mb-2">
            Password
          </label>

          <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Create a password"
                  required
                  class="w-full px-4 py-3 border border-slate-300 rounded-lg
                               outline-none focus:ring-2 focus:ring-accent
                               focus:border-accent"
          >

        </div>



        <!-- Confirm Password -->
        <div class="mb-6">

          <label for="confirmPassword"
                 class="block text-sm font-semibold text-slate-700 mb-2">
            Confirm Password
          </label>

          <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  placeholder="Confirm your password"
                  required
                  class="w-full px-4 py-3 border border-slate-300 rounded-lg
                               outline-none focus:ring-2 focus:ring-accent
                               focus:border-accent"
          >

        </div>


        <p id="errorMsg" class="hidden mb-4 text-sm text-red-600"></p>


        <!-- Register Button -->
        <button
                type="submit"
                class="w-full bg-primary hover:bg-primary-700
                           text-white font-semibold py-3 rounded-lg
                           transition duration-200">
          Create Account
        </button>

      </form>


      <!-- Login Link -->
      <div class="text-center mt-6">

        <p class="text-sm text-slate-600">
          Already have an account?

          <a href="login.html"
             class="text-accent-600 hover:text-accent-700 font-semibold">
            Login
          </a>
        </p>

      </div>

    </div>

  </div>

</main>
